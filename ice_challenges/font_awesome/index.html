<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renderfrost's Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
    <div class="card-header">
        <div class="user-info">
            <img src="images/renderfrost.png" alt="Profile" class="profile-img">
            <span class="username">Renderfrost</span>
        </div>
        <div class="meta-info">
            <span class="time-elapsed">20 mins</span>
            <img src="images/more_vert_24dp_E3E3E3.png" alt="">
        </div>
    </div>
    <main>
        <div class="card-image-container">
            <img src="images/gdlevel.jpg" alt="post" class="main-image">
        </div>
    </main>
    <footer>
        <img class="bookmark" src="images/bookmark_24dp_E3E3E3.png" alt="">
        <img class="share" src="images/share_24dp_E3E3E3.png" alt="">
        <img class="comments" src="images/chat_bubble_24dp_E3E3E3.png" alt="">
        <img class="favorite" src="images/favorite_24dp_E3E3E3.png" alt="">
    </footer>
</body>
</html>
