<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag Stories — Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery">
    <article class="poster chile-poster">
      <div class="poster-photo chile-photo"></div>
      <div class="flag chile">
        <div class="c1">
          <div class="star"></div>
        </div>
        <div class="c2"></div>
        <div class="c3"></div>
        <div class="c3"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>South America</p><h1>CHILE</h1><small>Mountain / Coast</small></div>
    </article>
    <article class="poster denmark-poster">
      <div class="poster-photo denmark-photo"></div>
      <div class="flag denmark">
        <div class="d1"></div>
        <div class="d2"></div>
        <div class="d3"></div>
        <div class="d4"></div>
        <div class="d5"></div>
        <div class="d6"></div>
        <div class="d7"></div>
        <div class="d8"></div>
        <div class="d9"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Scandinavia</p><h1>DENMARK</h1><small>North Sea / Light</small></div>
    </article>
    <article class="poster finland-poster">
      <div class="poster-photo finland-photo"></div>
      <div class="flag finland">
        <div class="f1"></div>
        <div class="f2"></div>
        <div class="f3"></div>
        <div class="f4"></div>
        <div class="f5"></div>
        <div class="f6"></div>
        <div class="f7"></div>
        <div class="f8"></div>
        <div class="f9"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Nordic Forests</p><h1>FINLAND</h1><small>Forest / Water</small></div>
    </article>
    <article class="poster car-poster">
      <div class="poster-photo car-photo"></div>
      <div class="flag car">
        <div class="r1">
          <div class="car-star"></div>
        </div>
        <div class="r2"></div>
        <div class="r3"></div>
        <div class="r4"></div>
        <div class="r5"></div>
        <div class="r6"></div>
        <div class="r7"></div>
        <div class="r8"></div>
        <div class="r9"></div>
        <div class="r10"></div>
        <div class="r11"></div>
        <div class="r12"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Central Africa</p><h1>C.A.R.</h1><small>River / Savanna</small></div>
    </article>
  </main>
</body>
</html>
